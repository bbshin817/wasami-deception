[/Script/UnrealEd.ProjectPackagingSettings]
; 「プロジェクトの Content を全部クックする」を明示的に立てる（Project Settings の Packaging の
; Advanced「Cook everything in the project content directory」）。本作は **C++ が /Game のパスを直に名指しして
; 読むアセットが 237 個**あり、そのうち 195 個はどのマップからも参照されていない（アセットレジストリから辿れない）
; ので、クックは /Game を全部なめる経路を通らなければならない。
; - この節を置かないでいると、UE 5.8 の CollectFilesToCook は「ほかで 1 つも足されなかったときだけ全部なめる」
;   という言わばおまけの経路（bCookAllByDefault && NumFilesAddedByCommandLineOrGameCallback == 0）に頼ることになる。
;   2026-09-21 の実際のクックではその数え上げが 0 にならず、**/Game のパッケージが L_Title の 1 つしか入らない**
;   パッケージが出来た（全 501 パッケージ・494 クック。中身はほぼエンジンとプラグインの既定のアセット）。
;   それでもクックは「成功」で終わり、UAT も BUILD SUCCESSFUL を返すので気づけない。
; - bCookAll=True は上の条件を飛ばして必ず全部なめるので、何が数え上げを増やしても影響を受けない。
;   ファイルを足す設定ではないので、195 個が落ちる心配も無い。
; - MapsToCook と DirectoriesToAlwaysCook は**書かない**（書くと「全部なめる」ではなく書いた分だけになる）。
bCookAll=True
; 救急車の画面の動画（Content/Movies/ambulance_tutorial2.mp4。dd_movies が SourceArt から写す）はアセットでなく
; ファイルなので、FileMediaSource が読めるように pak の外へそのまま置く（本家と同じ ./Movies/ の相対パス）。
+DirectoriesToAlwaysStageAsNonUFS=(Path="Movies")

[/Script/Engine.AssetManagerSettings]
; クック（エディタのコマンドレット）の起動時に GameFeatures プラグインが
; 「GameFeatureData 型の規則がアセットマネージャーの設定に無い」とエラーを出し、
; クック自体は成功しているのに UAT が 2 件のエラーで BUILD FAILED（ExitCode=25）になる。
; GameFeatures は MCP のツールセット（AllToolsets → GameFeaturesToolset。どちらもエディタ専用）が
; 依存して有効になるだけで、本作は Game Feature プラグインを 1 つも使わない。規則だけ置いて黙らせる。
; - Priority を既定の -1 から変えるのが目的（UE 5.8 GameFeaturesSubsystem.cpp OnAssetManagerCreated は
;   FPrimaryAssetRules::IsDefault() を見る）。CookRule=Unknown・Directories 空なので何も走査せずクックにも効かない。
; - bIsEditorOnly=True なので、パッケージした本編は項目ごと読み飛ばす
;   （AssetManager.cpp ShouldScanPrimaryAssetType の `bIsEditorOnly && !GIsEditor`）。
;   本編に GameFeatures モジュールは入らないので、クラスを読もうとして ensure が出ることもない。
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=,SpecificAssets=,Rules=(Priority=1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
