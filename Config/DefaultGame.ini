[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=5682C76F45A0B5A3C071499AC0F54D70
; The title's version text (v + this): 1.0.0, the user's answer of 2026-09-20.
ProjectVersion=1.0.0

; No [/Script/UnrealEd.ProjectPackagingSettings] section on purpose. With no MapsToCook, no DirectoriesToAlwaysCook
; and no [AllMaps] ini section, the cooker falls through to its "cook everything" path (UE 5.8
; CookOnTheFlyServer.cpp: bCookAllByDefault = true at the top, and the bCookAll test near the end of
; CollectFilesToCook fires while NumFilesAddedByCommandLineOrGameCallback == 0), so every package under /Game is
; cooked. The game needs that: 237 assets are loaded from C++ by hard-coded /Game path (audio, UI textures, camera
; shakes, the enemy's animations) and 195 of them sit in no map, so the asset registry cannot reach them. Filling in
; "Maps to Cook" or "Directories to Always Cook" in Project Settings makes that counter non-zero and would silently
; drop those 195 from the build. If the cook ever has to be restricted, set bCookAll=True instead.

[/Script/Engine.AssetManagerSettings]
; クック（エディタのコマンドレット）の起動時に GameFeatures プラグインが
; 「GameFeatureData 型の規則がアセットマネージャーの設定に無い」とエラーを出し、
; クック自体は成功しているのに UAT が 2 件のエラーで BUILD FAILED（ExitCode=25）になる。
; GameFeatures は MCP のツールセット（AllToolsets → GameFeaturesToolset。どちらもエディタ専用）が
; 依存して有効になるだけで、本作は Game Feature プラグインを 1 つも使わない。規則だけ置いて黙らせる。
; - Priority を既定の -1 から変えるのが目的（UE 5.8 GameFeaturesSubsystem.cpp OnAssetManagerCreated は
;   FPrimaryAssetRules::IsDefault() を見る）。CookRule=Unknown・Directories 空なので何も走査せずクックにも効かない。
; - bIsEditorOnly=True なので、パッケージした本編は項目ごと読み飛ばす
;   （AssetManager.cpp ShouldScanPrimaryAssetType の `bIsEditorOnly && !GIsEditor`）。
;   本編に GameFeatures モジュールは入らないので、クラスを読もうとして ensure が出ることもない。
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=,SpecificAssets=,Rules=(Priority=1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
