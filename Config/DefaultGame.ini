ProjectVersion=1.0.0

; No [/Script/UnrealEd.ProjectPackagingSettings] section on purpose. With no MapsToCook, no DirectoriesToAlwaysCook
; and no [AllMaps] ini section, the cooker falls through to its "cook everything" path (UE 5.8
; CookOnTheFlyServer.cpp: bCookAllByDefault = true at the top, and the bCookAll test near the end of
; CollectFilesToCook fires while NumFilesAddedByCommandLineOrGameCallback == 0), so every package under /Game is
; cooked. The game needs that: 237 assets are loaded from C++ by hard-coded /Game path (audio, UI textures, camera
; shakes, the enemy's animations) and 195 of them sit in no map, so the asset registry cannot reach them. Filling in
; "Maps to Cook" or "Directories to Always Cook" in Project Settings makes that counter non-zero and would silently
; drop those 195 from the build. If the cook ever has to be restricted, set bCookAll=True instead.
