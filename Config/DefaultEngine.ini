; GeForce GTX 1660 SUPER (this project's PC) has no RT cores: Lumen runs in software.
r.RayTracing=False

r.RayTracing.RayTracingProxies.ProjectEnabled=True

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

; Exposure and the other post-process defaults follow the original game's project settings
; (pak_reference_2/_raw/DDeception/Config/DefaultEngine.ini, UE 4.24). The hospital's Zone 1 has no
; PostProcessVolume at all and neither Zone 2's nor the entrance's volume overrides exposure, so in the
; original these project defaults ARE the exposure: auto exposure off => fixed exposure (SceneView.cpp
; sets AutoExposureMinBrightness = AutoExposureMaxBrightness = 1).
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=False
r.DefaultFeature.AutoExposure.Bias=0.0
r.DefaultFeature.LensFlare=False
r.DefaultFeature.LightUnits=1
; Not copied from the original, on purpose:
;   r.UsePreExposure=False    - pre-exposure is a precision trick that cancels out in the tonemapper, and with a
;                               fixed exposure of 1.0 it is a no-op; flipping it recompiles every shader.
;   r.DefaultFeature.MotionBlur=False - the original does set this (and never turns motion blur back on: the game
;                               has no motion blur option and no bytecode touches it), but on 2026-09-16 the user
;                               chose to keep the engine's 0.5, matching the earlier decision in handover.md.

; Local exposure is UE 5 only, so the original cannot have it. 1.0 is the engine's "off" value
; (Scene.cpp); a new UE 5 project ships 0.8, which would grade the image away from the original.
r.DefaultFeature.LocalExposure.HighlightContrastScale=1.0

r.DefaultFeature.LocalExposure.ShadowContrastScale=1.0

