[/Script/Engine.RendererSettings]
; Lighting follows the original, which bakes: 1,015 of Zone 1's 1,120 lights are Static and the meshes carry a
; lightmap UV (_meshes.json: lightmap_uv_index 1). The original's own settings are r.AllowStaticLighting=True and
; r.GenerateMeshDistanceFields=False (pak_reference_2/_raw/DDeception/Config/DefaultEngine.ini, UE 4.24).
; Lumen cannot stand in for that bake here: the stage is a handful of merged meshes up to 270 m across, so a mesh
; distance field (256 voxels per mesh at most) puts a voxel at over 50 cm and the software trace sees no walls at
; all — measured 2026-09-16, turning Lumen's diffuse indirect off changed the picture by 2.6 in mean luminance.
r.AllowStaticLighting=True
r.Shadow.Virtual.Enable=1

r.GenerateMeshDistanceFields=False

; No dynamic GI (the original is UE 4.24: baked lightmaps plus 105 movable lights), and screen space reflections
; on top of the level's 10 reflection captures, which is what the original has.
r.DynamicGlobalIlluminationMethod=0

r.ReflectionMethod=2

r.SkinCache.CompileShaders=True

; GeForce GTX 1660 SUPER (this project's PC) has no RT cores: Lumen runs in software.
r.RayTracing=False

r.RayTracing.RayTracingProxies.ProjectEnabled=True

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

; Exposure and the other post-process defaults follow the original game's project settings
; (pak_reference_2/_raw/DDeception/Config/DefaultEngine.ini, UE 4.24). The hospital's Zone 1 has no
; PostProcessVolume at all and neither Zone 2's nor the entrance's volume overrides exposure, so in the
; original these project defaults ARE the exposure: auto exposure off => fixed exposure (SceneView.cpp
; sets AutoExposureMinBrightness = AutoExposureMaxBrightness = 1).
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=False
r.DefaultFeature.AutoExposure.Bias=0.0
r.DefaultFeature.LensFlare=False
r.DefaultFeature.LightUnits=1
; Not copied from the original, on purpose:
;   r.UsePreExposure=False    - pre-exposure is a precision trick that cancels out in the tonemapper, and with a
;                               fixed exposure of 1.0 it is a no-op; flipping it recompiles every shader.
;                               Its one visible effect is copied below instead.
; The original has no pre-exposure. UE 5.8 pre-exposes with the eye adaptation read back from a frame or two
; before (the method stays Histogram with auto exposure off; PostProcessEyeAdaptation.cpp, UpdatePreExposure),
; so the teleport's +100 EV flash (CameraAnim_Teleport) overflowed the next frames' scene colour into a black
; frame. A fixed pre-exposure of 1.0 is what the fixed exposure already gives every other frame (the image
; measured the same to 0.02 of 255) and keeps the flash white, as in the original. Chosen by the user, 2026-09-16.
r.EyeAdaptation.PreExposureOverride=1
;   r.DefaultFeature.MotionBlur=False - the original does set this (and never turns motion blur back on: the game
;                               has no motion blur option and no bytecode touches it), but on 2026-09-16 the user
;                               chose to keep the engine's 0.5, matching the earlier decision in handover.md.

; Local exposure is UE 5 only, so the original cannot have it. 1.0 is the engine's "off" value
; (Scene.cpp); a new UE 5 project ships 0.8, which would grade the image away from the original.
r.DefaultFeature.LocalExposure.HighlightContrastScale=1.0

r.DefaultFeature.LocalExposure.ShadowContrastScale=1.0

