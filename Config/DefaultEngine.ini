; The camera's 90 degree FOV is horizontal in the original: UE 4.24's engine default is MaintainXFOV and the
; original's project settings do not override it. UE 5's engine default changed to MaintainYFOV, which keeps the
; 16:9 vertical FOV instead, so on this PC's 21:9 screen the same view would span 107 degrees horizontally
; rather than 90 and everything would look smaller. 16:9 is unaffected either way.
